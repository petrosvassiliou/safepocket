name: Direct Distribution Self-Update Release (PWA + Android APK + macOS DMG)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic release version (current: 0.5.0-beta.3)'
        required: false
        default: '0.5.0-beta.3'
      version_code:
        description: 'Monotonic integer build number (current: 18)'
        required: false
        default: '18'

permissions:
  contents: write

jobs:
  build-pwa:
    name: Build & Verify ChromeOS/Web Offline PWA
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/v}"
            VER_NAME="${RAW_TAG}"
            if [[ "${RAW_TAG}" == "0.1" ]]; then
              VER_CODE="1"
            elif [[ "${RAW_TAG}" == "0.1.1" ]]; then
              VER_CODE="2"
            elif [[ "${RAW_TAG}" == "0.1.2" ]]; then
              VER_CODE="3"
            elif [[ "${RAW_TAG}" == "0.2" || "${RAW_TAG}" == "0.2.0" ]]; then
              VER_CODE="4"
            elif [[ "${RAW_TAG}" == "0.3" || "${RAW_TAG}" == "0.3.0" ]]; then
              VER_CODE="5"
            elif [[ "${RAW_TAG}" == "0.3.1" ]]; then
              VER_CODE="6"
            elif [[ "${RAW_TAG}" == "0.3.2" ]]; then
              VER_CODE="7"
            elif [[ "${RAW_TAG}" == "0.3.3" ]]; then
              VER_CODE="8"
            elif [[ "${RAW_TAG}" == "0.3.4" ]]; then
              VER_CODE="9"
            elif [[ "${RAW_TAG}" == "0.3.5" ]]; then
              VER_CODE="10"
            elif [[ "${RAW_TAG}" == "0.3.6" ]]; then
              VER_CODE="11"
            elif [[ "${RAW_TAG}" == "0.3.7" ]]; then
              VER_CODE="12"
            elif [[ "${RAW_TAG}" == "0.3.8" ]]; then
              VER_CODE="13"
            elif [[ "${RAW_TAG}" == "0.3.9" ]]; then
              VER_CODE="14"
            elif [[ "${RAW_TAG}" == "0.4" || "${RAW_TAG}" == "0.4.0" ]]; then
              VER_CODE="15"
            elif [[ "${RAW_TAG}" == "0.5.0-beta.1" ]]; then
              VER_CODE="16"
            elif [[ "${RAW_TAG}" == "0.5.0-beta.2" ]]; then
              VER_CODE="17"
            elif [[ "${RAW_TAG}" == "0.5.0-beta.3" ]]; then
              VER_CODE="18"
            else
              VER_CODE="${GITHUB_RUN_NUMBER:-18}"
            fi
          else
            VER_NAME="${{ inputs.version_name || '0.5.0-beta.3' }}"
            VER_CODE="${{ inputs.version_code || '18' }}"
          fi
          echo "version_name=${VER_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VER_CODE}" >> "${GITHUB_OUTPUT}"
          if [[ "${VER_NAME}" == *-* ]]; then
            echo "is_prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pwaApp/package-lock.json

      - name: Install, Test & Build PWA
        working-directory: pwaApp
        run: |
          npm ci
          npm test
          npm run build

      - name: Package PWA offline archive
        run: |
          tar -czf "safepocket-chromeos-pwa-v${{ steps.meta.outputs.version_name }}.tar.gz" -C pwaApp/dist .

      - name: Upload PWA archive
        uses: actions/upload-artifact@v4
        with:
          name: pwa-bundle
          path: safepocket-chromeos-pwa-v*.tar.gz

  build-android-apk:
    name: Build Native Android Universal APK (arm64-v8a + x86_64)
    needs: build-pwa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode optional Android release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAFEPOCKET_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            mkdir -p androidApp/keystore
            echo "${KEYSTORE_BASE64}" | base64 --decode > androidApp/keystore/release.jks
            echo "Decoded release keystore ($(wc -c < androidApp/keystore/release.jks) bytes)"
          fi

      - name: Assemble Android Universal Release APK
        env:
          SAFEPOCKET_RELEASE_VERSION: ${{ needs.build-pwa.outputs.version_name }}
          SAFEPOCKET_VERSION_CODE: ${{ needs.build-pwa.outputs.version_code }}
          SAFEPOCKET_KEYSTORE_PASSWORD: ${{ secrets.SAFEPOCKET_KEYSTORE_PASSWORD }}
          SAFEPOCKET_KEY_ALIAS: ${{ secrets.SAFEPOCKET_KEY_ALIAS }}
          SAFEPOCKET_KEY_PASSWORD: ${{ secrets.SAFEPOCKET_KEY_PASSWORD }}
        run: |
          gradle :androidApp:assembleRelease \
            -PversionName="${SAFEPOCKET_RELEASE_VERSION}" \
            -PversionCode="${SAFEPOCKET_VERSION_CODE}" \
            --no-daemon
          APK_SRC="$(find androidApp/build/outputs/apk/release -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
          OUT_APK="SafePocket-v${SAFEPOCKET_RELEASE_VERSION}-b${SAFEPOCKET_VERSION_CODE}-universal-arm64-x86_64.apk"
          cp "${APK_SRC}" "${OUT_APK}"
          keytool -printcert -jarfile "${OUT_APK}" | head -n 12

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SafePocket-v*-universal-arm64-x86_64.apk

  build-macos-dmg:
    name: Build Native macOS Universal App & DMG (Apple Silicon + Intel)
    needs: build-pwa
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package universal SafePocket.app & UDZO .dmg
        env:
          SAFEPOCKET_RELEASE_VERSION: ${{ needs.build-pwa.outputs.version_name }}
          SAFEPOCKET_VERSION_CODE: ${{ needs.build-pwa.outputs.version_code }}
        run: |
          chmod +x scripts/package-macos-dmg.sh
          ./scripts/package-macos-dmg.sh \
            "SafePocket-${SAFEPOCKET_RELEASE_VERSION}-${SAFEPOCKET_VERSION_CODE}-macOS-universal.dmg"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: SafePocket-*-macOS-universal.dmg

  sign-manifest-and-publish:
    name: Ed25519 Sign version.json & Publish GitHub Release
    needs: [build-pwa, build-android-apk, build-macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download all platform release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Compute SHA-256 digests & Ed25519 sign manifest/version.json
        env:
          SAFEPOCKET_ED25519_SEED_HEX: ${{ secrets.SAFEPOCKET_ED25519_SEED_HEX }}
          SAFEPOCKET_RELEASE_VERSION: ${{ needs.build-pwa.outputs.version_name }}
          SAFEPOCKET_VERSION_CODE: ${{ needs.build-pwa.outputs.version_code }}
          SAFEPOCKET_RELEASE_CHANNEL: ${{ needs.build-pwa.outputs.is_prerelease == 'true' && 'beta' || 'stable' }}
        run: |
          APK_FILE="$(ls dist-artifacts/SafePocket-v*-universal-arm64-x86_64.apk | head -n 1)"
          DMG_FILE="$(ls dist-artifacts/SafePocket-*-macOS-universal.dmg | head -n 1)"
          SAFEPOCKET_APK_PATH="${APK_FILE}" \
          SAFEPOCKET_DMG_PATH="${DMG_FILE}" \
          node scripts/sign-update-manifest.mjs
          cp manifest/version.json dist-artifacts/version.json

      - name: Upload signed release assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SafePocket v${{ needs.build-pwa.outputs.version_name }} (Build ${{ needs.build-pwa.outputs.version_code }})
          prerelease: ${{ needs.build-pwa.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.build-pwa.outputs.is_prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          body: |
            ## SafePocket v${{ needs.build-pwa.outputs.version_name }} (Build ${{ needs.build-pwa.outputs.version_code }}) — Zero-Knowledge Personal Vault

            ### Direct-Distribution Signed Artifacts
            - **Android 10+ / Android 17+ / Googlebook OS (`arm64-v8a` + `x86_64`)**: `SafePocket-v${{ needs.build-pwa.outputs.version_name }}-b${{ needs.build-pwa.outputs.version_code }}-universal-arm64-x86_64.apk`
            - **macOS 14+ Universal (`Apple Silicon + Intel`)**: `SafePocket-${{ needs.build-pwa.outputs.version_name }}-${{ needs.build-pwa.outputs.version_code }}-macOS-universal.dmg`
            - **ChromeOS / Web Offline PWA Bundle**: `safepocket-chromeos-pwa-v${{ needs.build-pwa.outputs.version_name }}.tar.gz` (Live EU Hosting: https://safepocket-vault-eu.web.app)
            - **Ed25519-Signed Update Manifest & SHA-256 Digests**: `version.json`
          files: dist-artifacts/*
