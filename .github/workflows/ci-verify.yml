name: SafePocket CI Verification & EU Hosting Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pwa-typecheck-test-and-manifest:
    name: ChromeOS PWA • TypeScript, Full Vitest Suite & Ed25519 Manifest (v0.3.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pwaApp/package-lock.json

      - name: Install ChromeOS PWA dependencies
        working-directory: pwaApp
        run: npm ci

      - name: Run Zero-Knowledge, SQLite WASM, Scanner, Expiry, Backup & Ed25519 Vitest suite
        working-directory: pwaApp
        run: npm test

      - name: Production TypeScript check & Vite offline bundle build
        working-directory: pwaApp
        run: npm run build

      - name: Upload built PWA dist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: pwaApp/dist
          retention-days: 5

  localization-catalog-parity:
    name: 6-Language ARB Catalog Parity (EN, DE, IT, FR, ES, EL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify identical localization key sets across all 6 ARB catalogs
        run: |
          node -e '
            const fs = require("node:fs");
            const locales = ["en", "de", "it", "fr", "es", "el"];
            const enKeys = Object.keys(JSON.parse(fs.readFileSync("i18n/en.arb.json", "utf8")))
              .filter((k) => !k.startsWith("@@"))
              .sort();
            for (const loc of locales) {
              const keys = Object.keys(JSON.parse(fs.readFileSync(`i18n/${loc}.arb.json`, "utf8")))
                .filter((k) => !k.startsWith("@@"))
                .sort();
              if (JSON.stringify(keys) !== JSON.stringify(enKeys)) {
                console.error(`ARB key mismatch in ${loc}.arb.json`);
                process.exit(1);
              }
            }
            console.log(`Verified ${enKeys.length} localization keys across ${locales.length} locales.`);
          '

  deploy-eu-firebase-hosting:
    name: Auto-Deploy EU Firebase Hosting (safepocket-vault-eu)
    needs: [pwa-typecheck-test-and-manifest, localization-catalog-parity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified PWA dist bundle
        uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: pwaApp/dist

      - name: Deploy to EU Firebase Hosting if credentials secret is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SAFEPOCKET_EU }}
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            SA_FILE="$(mktemp)"
            printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${SA_FILE}"
            export GOOGLE_APPLICATION_CREDENTIALS="${SA_FILE}"
            npx --yes firebase-tools deploy --only hosting --project safepocket-vault-eu --non-interactive
            rm -f "${SA_FILE}"
          elif [ -n "${FIREBASE_CLI_TOKEN}" ]; then
            npx --yes firebase-tools deploy --only hosting --project safepocket-vault-eu --token "${FIREBASE_CLI_TOKEN}" --non-interactive
          else
            echo "No FIREBASE_SERVICE_ACCOUNT_SAFEPOCKET_EU or FIREBASE_TOKEN secret configured; skipping CI Hosting deploy."
          fi
